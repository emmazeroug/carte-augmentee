<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function() {
            const exampleTarget = document.querySelector('#affiche');
            
            // Suivi de la cible (optionnel, utile pour le débogage)
            exampleTarget.addEventListener("targetFound", event => {
                console.log("target found");
            });
            exampleTarget.addEventListener("targetLost", event => {
                console.log("target lost");
            });

            // LOGIQUE DE LA GALERIE DE PHOTOS AVEC SWIPE
            const photos = ['#photo1', '#photo2', '#photo3']; 
            let currentIndex = 0; 
            const galleryImage = document.querySelector('#gallery-image');

            // Variables pour stocker la position du doigt
            let touchstartX = 0;
            let touchendX = 0;

            // Fonction qui analyse le mouvement du doigt
            function handleSwipe() {
                const swipeThreshold = 50; // Distance minimum (en pixels) pour considérer que c'est un swipe
                const diff = touchendX - touchstartX;

                if (diff < -swipeThreshold) {
                    // Swipe vers la gauche : on passe à l'image suivante
                    currentIndex = (currentIndex + 1) % photos.length; 
                    galleryImage.setAttribute('src', photos[currentIndex]);
                    console.log("Image suivante");
                } 
                else if (diff > swipeThreshold) {
                    // Swipe vers la droite : on passe à l'image précédente
                    // L'astuce (+ photos.length) % photos.length permet d'éviter les nombres négatifs
                    currentIndex = (currentIndex - 1 + photos.length) % photos.length; 
                    galleryImage.setAttribute('src', photos[currentIndex]);
                    console.log("Image précédente");
                }
            }

            // Écouteur quand le doigt touche l'écran
            window.addEventListener('touchstart', e => {
                touchstartX = e.changedTouches[0].screenX;
            });

            // Écouteur quand le doigt quitte l'écran
            window.addEventListener('touchend', e => {
                touchendX = e.changedTouches[0].screenX;
                handleSwipe(); // On vérifie s'il y a eu un swipe
            });
      });
    </script>
</head>

<body>
    <a-scene
        mindar-image="imageTargetSrc: ./carte.mind;"
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets>
            <!-- Liste de tes photos (remplace par tes propres fichiers) -->
            <img id="photo1" src="./plat1.jpg" />
            <img id="photo2" src="./plat2.jpg" />
            <img id="photo3" src="./plat3.jpg" />
        </a-assets>

        <a-entity mindar-image-target="targetIndex: 0" id="affiche">
            <!-- L'image principale affichée au milieu -->
            <a-plane id="gallery-image" src="#photo1" position="0 0 0" width="0.707" height="1" scale="1.5 1.5 1.5" rotation="0 0 0"></a-plane>
        </a-entity>

        <!-- La caméra a été simplifiée (plus besoin de cursor/raycaster puisqu'on swipe sur tout l'écran) -->
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>
</body>

</html>

<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <script>
        // 1. BASE DE DONNÉES DES IMAGES PAR CATÉGORIE
        const categories = {
            entrees: ['#entree1', '#entree2'],
            plats:   ['#plat1', '#plat2', '#plat3'],
            desserts:['#dessert1', '#dessert2']
        };

        let currentCategory = 'plats';
        let currentIndex = 0; 

        // FONCTION POUR METTRE À JOUR LES POINTS
        function updateDots() {
            const numDots = categories[currentCategory].length;
            const spacing = 0.15; 
            const startX = -(numDots - 1) * spacing / 2; 

            for (let i = 0; i < 5; i++) {
                const dot = document.querySelector('#dot-' + i);
                if (i < numDots) {
                    dot.setAttribute('visible', 'true');
                    dot.setAttribute('position', `${startX + i * spacing} 0 0`);
                    
                    if (i === currentIndex) {
                        dot.setAttribute('color', '#81B29A');
                        dot.setAttribute('opacity', '1');
                    } else {
                        dot.setAttribute('color', '#FFFFFF');
                        dot.setAttribute('opacity', '0.4');
                    }
                } else {
                    dot.setAttribute('visible', 'false');
                }
            }
        }

        // 2. FONCTION GLOBALE POUR CHANGER DE CATÉGORIE
        window.updateCategory = function(catName) {
            if(currentCategory === catName) return; // Ne rien faire si on clique sur la catégorie déjà active

            currentCategory = catName;
            currentIndex = 0; 
            
            const galleryImage = document.querySelector('#gallery-image');
            galleryImage.setAttribute('src', categories[currentCategory][currentIndex]);

            // Réinitialiser les couleurs des textes
            document.querySelector('#btn-entrees').setAttribute('color', '#F6FDFF');
            document.querySelector('#btn-plats').setAttribute('color', '#F6FDFF');
            document.querySelector('#btn-desserts').setAttribute('color', '#F6FDFF');
            
            // Mettre en surbrillance la catégorie active
            document.querySelector('#btn-' + catName).setAttribute('color', '#81B29A');
            
            updateDots(); // Met à jour les points
        };

        // 3. COMPOSANT A-FRAME POUR LES CLICS (CORRIGÉ POUR MOBILE)
        AFRAME.registerComponent('categorie-cliquable', {
            schema: { type: 'string' },
            init: function () {
                // On utilise 'touchstart' : la détection est immédiate au toucher du doigt, impossible de la rater !
                this.el.addEventListener('touchstart', () => { window.updateCategory(this.data); });
                // On garde mousedown/click pour que ça marche aussi sur ordinateur avec la souris
                this.el.addEventListener('mousedown', () => { window.updateCategory(this.data); });
            }
        });

        // 4. LOGIQUE DU SWIPE
        document.addEventListener("DOMContentLoaded", function() {
            updateDots();

            let touchstartX = 0;
            let touchendX = 0;

            function handleSwipe() {
                const swipeThreshold = 50; 
                const diff = touchendX - touchstartX;
                const photos = categories[currentCategory]; 

                if (diff < -swipeThreshold) {
                    // Swipe gauche
                    currentIndex = (currentIndex + 1) % photos.length; 
                    document.querySelector('#gallery-image').setAttribute('src', photos[currentIndex]);
                    updateDots(); 
                } 
                else if (diff > swipeThreshold) {
                    // Swipe droite
                    currentIndex = (currentIndex - 1 + photos.length) % photos.length; 
                    document.querySelector('#gallery-image').setAttribute('src', photos[currentIndex]);
                    updateDots(); 
                }
            }

            window.addEventListener('touchstart', e => { 
                touchstartX = e.changedTouches[0].screenX; 
            });
            window.addEventListener('touchend', e => {
                touchendX = e.changedTouches[0].screenX;
                handleSwipe();
            });
        });
    </script>
</head>

<body>
    <a-scene
        mindar-image="imageTargetSrc: ./carte.mind;"
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets>
            <img id="entree1" src="./entree1.jpg" />
            <img id="entree2" src="./entree2.jpg" />
            <img id="plat1" src="./plat1.jpg" />
            <img id="plat2" src="./plat2.jpg" />
            <img id="plat3" src="./plat3.jpg" />
            <img id="dessert1" src="./dessert1.jpg" />
            <img id="dessert2" src="./dessert2.jpg" />
        </a-assets>

        <a-entity mindar-image-target="targetIndex: 0" id="affiche">
            
            <!-- LES BOUTONS MENUS -->
            <!-- J'ai mis Z à 0.05 (pour qu'ils soient au-dessus) et ajouté un fond noir semi-transparent (opacity: 0.3) -->
            <a-text id="btn-entrees" class="clickable" categorie-cliquable="entrees" value="Entrees" align="left" position="-0.6 0.9 0.05" scale="0.6 0.6 0.6" color="#F6FDFF" 
                    geometry="primitive: plane; width: 1.5; height: 0.4" material="color: #000000; opacity: 0.3; transparent: true"></a-text>
            
            <a-text id="btn-plats" class="clickable" categorie-cliquable="plats" value="Plats" align="left" position="-0.6 0.7 0.05" scale="0.6 0.6 0.6" color="#81B29A" 
                    geometry="primitive: plane; width: 1.5; height: 0.4" material="color: #000000; opacity: 0.3; transparent: true"></a-text>
            
            <a-text id="btn-desserts" class="clickable" categorie-cliquable="desserts" value="Desserts" align="left" position="-0.6 0.5 0.05" scale="0.6 0.6 0.6" color="#F6FDFF" 
                    geometry="primitive: plane; width: 1.5; height: 0.4" material="color: #000000; opacity: 0.3; transparent: true"></a-text>

            <!-- L'IMAGE PRINCIPALE -->
            <a-plane id="gallery-image" src="#plat1" position="0 -0.3 0" width="1" height="1" scale="0.8 0.8 0.8" rotation="0 0 0"></a-plane>
            
            <!-- LES POINTS DE PAGINATION -->
            <a-entity id="dots-container" position="0 -0.8 0">
                <a-circle id="dot-0" radius="0.025" visible="false"></a-circle>
                <a-circle id="dot-1" radius="0.025" visible="false"></a-circle>
                <a-circle id="dot-2" radius="0.025" visible="false"></a-circle>
                <a-circle id="dot-3" radius="0.025" visible="false"></a-circle>
                <a-circle id="dot-4" radius="0.025" visible="false"></a-circle>
            </a-entity>

        </a-entity>

        <!-- LA CAMÉRA (INDISPENSABLE POUR LES CLICS) -->
        <a-camera cursor="fuse: false; rayOrigin: mouse;" raycaster="objects: .clickable" position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>
</body>
</html>

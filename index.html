<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <script>
        // 1. BASE DE DONNÉES DES IMAGES PAR CATÉGORIE
        const categories = {
            entrees: ['#entree1', '#entree2'],
            plats:   ['#plat1', '#plat2', '#plat3'],
            desserts:['#dessert1', '#dessert2']
        };

        // Variables pour retenir où on en est
        let currentCategory = 'plats';
        let currentIndex = 0; 

        // 2. FONCTION GLOBALE POUR CHANGER DE CATÉGORIE
        window.updateCategory = function(catName) {
            currentCategory = catName;
            currentIndex = 0; // On revient à la première photo de la catégorie
            
            // On change l'image
            const galleryImage = document.querySelector('#gallery-image');
            galleryImage.setAttribute('src', categories[currentCategory][currentIndex]);

            // On remet tous les textes en blanc
            document.querySelector('#btn-entrees').setAttribute('color', 'white');
            document.querySelector('#btn-plats').setAttribute('color', 'white');
            document.querySelector('#btn-desserts').setAttribute('color', 'white');

            // On met en jaune la catégorie actuellement sélectionnée
            document.querySelector('#btn-' + catName).setAttribute('color', 'yellow');
            console.log("Catégorie changée : " + catName);
        };

        // 3. COMPOSANT A-FRAME POUR LES CLICS (La méthode la plus fiable en 3D)
        // Ceci dit au moteur 3D : "Dès qu'un élément a cet attribut, rends-le cliquable"
        AFRAME.registerComponent('categorie-cliquable', {
            schema: { type: 'string' },
            init: function () {
                // 'mousedown' est ultra réactif sur téléphone (dès qu'on pose le doigt)
                this.el.addEventListener('mousedown', () => {
                    window.updateCategory(this.data);
                });
                // 'click' classique au cas où
                this.el.addEventListener('click', () => {
                    window.updateCategory(this.data);
                });
            }
        });

        // 4. LOGIQUE DU SWIPE (Glissement de doigt)
        document.addEventListener("DOMContentLoaded", function() {
            let touchstartX = 0;
            let touchendX = 0;

            function handleSwipe() {
                const swipeThreshold = 50; 
                const diff = touchendX - touchstartX;
                const photos = categories[currentCategory]; // On récupère les photos de la catégorie actuelle

                if (diff < -swipeThreshold) {
                    // Swipe gauche
                    currentIndex = (currentIndex + 1) % photos.length; 
                    document.querySelector('#gallery-image').setAttribute('src', photos[currentIndex]);
                } 
                else if (diff > swipeThreshold) {
                    // Swipe droite
                    currentIndex = (currentIndex - 1 + photos.length) % photos.length; 
                    document.querySelector('#gallery-image').setAttribute('src', photos[currentIndex]);
                }
            }

            // Écouteurs pour le glissement
            window.addEventListener('touchstart', e => {
                touchstartX = e.changedTouches[0].screenX;
            });

            window.addEventListener('touchend', e => {
                touchendX = e.changedTouches[0].screenX;
                handleSwipe();
            });
        });
    </script>
</head>

<body>
    <a-scene
        mindar-image="imageTargetSrc: ./carte.mind;"
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets>
            <!-- IMAGES DES ENTRÉES -->
            <img id="entree1" src="./entree1.jpg" />
            <img id="entree2" src="./entree2.jpg" />
            
            <!-- IMAGES DES PLATS -->
            <img id="plat1" src="./plat1.jpg" />
            <img id="plat2" src="./plat2.jpg" />
            <img id="plat3" src="./plat3.jpg" />
            
            <!-- IMAGES DES DESSERTS -->
            <img id="dessert1" src="./dessert1.jpg" />
            <img id="dessert2" src="./dessert2.jpg" />
        </a-assets>

        <a-entity mindar-image-target="targetIndex: 0" id="affiche">
            
            <!-- LES TEXTES (MENUS) -->
            <!-- J'ai ajouté le composant 'categorie-cliquable' et changé l'opacité à 0.01 pour que le clic soit bien détecté -->
            <a-text id="btn-entrees" class="clickable" categorie-cliquable="entrees" value="ENTREES" align="center" position="0 0.9 0" scale="0.6 0.6 0.6" color="white" 
                    geometry="primitive: plane; width: 1.5; height: 0.4" material="opacity: 0.01; transparent: true"></a-text>
            
            <a-text id="btn-plats" class="clickable" categorie-cliquable="plats" value="PLATS" align="center" position="0 0.7 0" scale="0.6 0.6 0.6" color="yellow" 
                    geometry="primitive: plane; width: 1.5; height: 0.4" material="opacity: 0.01; transparent: true"></a-text>
            
            <a-text id="btn-desserts" class="clickable" categorie-cliquable="desserts" value="DESSERTS" align="center" position="0 0.5 0" scale="0.6 0.6 0.6" color="white" 
                    geometry="primitive: plane; width: 1.5; height: 0.4" material="opacity: 0.01; transparent: true"></a-text>

            <!-- L'IMAGE PRINCIPALE -->
            <a-plane id="gallery-image" src="#plat1" position="0 -0.3 0" width="1" height="1" scale="0.8 0.8 0.8" rotation="0 0 0"></a-plane>
            
        </a-entity>

        <!-- LA CAMÉRA (INDISPENSABLE POUR LES CLICS) -->
        <a-camera cursor="fuse: false; rayOrigin: mouse;" raycaster="objects: .clickable" position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>
</body>
</html>

<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 1. BASE DE DONNÉES DES IMAGES PAR CATÉGORIE
            // Remplace ces noms par tes vrais fichiers images
            const categories = {
                entrees: ['#entree1', '#entree2'],
                plats:   ['#plat1', '#plat2', '#plat3'],
                desserts:['#dessert1', '#dessert2']
            };

            // On démarre par défaut sur la catégorie "plats"
            let currentCategory = 'plats';
            let photos = categories[currentCategory]; 
            let currentIndex = 0; 
            
            const galleryImage = document.querySelector('#gallery-image');
            
            // Les boutons textes
            const btnEntree = document.querySelector('#btn-entree');
            const btnPlat = document.querySelector('#btn-plat');
            const btnDessert = document.querySelector('#btn-dessert');

            // 2. FONCTION POUR CHANGER DE CATÉGORIE
            function updateCategory(catName) {
                currentCategory = catName;
                photos = categories[currentCategory]; // On charge les nouvelles photos
                currentIndex = 0; // On revient à la première photo de la catégorie
                galleryImage.setAttribute('src', photos[currentIndex]);

                // On remet tous les textes en blanc
                btnEntree.setAttribute('color', 'white');
                btnPlat.setAttribute('color', 'white');
                btnDessert.setAttribute('color', 'white');

                // On met en jaune la catégorie actuellement sélectionnée
                if (catName === 'entrees') btnEntree.setAttribute('color', 'yellow');
                if (catName === 'plats') btnPlat.setAttribute('color', 'yellow');
                if (catName === 'desserts') btnDessert.setAttribute('color', 'yellow');
            }

            // Écouteurs de clics sur les textes
            btnEntree.addEventListener('click', () => updateCategory('entrees'));
            btnPlat.addEventListener('click', () => updateCategory('plats'));
            btnDessert.addEventListener('click', () => updateCategory('desserts'));

            // 3. LOGIQUE DU SWIPE (Glissement de doigt)
            let touchstartX = 0;
            let touchendX = 0;

            function handleSwipe() {
                const swipeThreshold = 50; 
                const diff = touchendX - touchstartX;

                if (diff < -swipeThreshold) {
                    // Swipe gauche
                    currentIndex = (currentIndex + 1) % photos.length; 
                    galleryImage.setAttribute('src', photos[currentIndex]);
                } 
                else if (diff > swipeThreshold) {
                    // Swipe droite
                    currentIndex = (currentIndex - 1 + photos.length) % photos.length; 
                    galleryImage.setAttribute('src', photos[currentIndex]);
                }
            }

            window.addEventListener('touchstart', e => {
                touchstartX = e.changedTouches[0].screenX;
            });

            window.addEventListener('touchend', e => {
                touchendX = e.changedTouches[0].screenX;
                handleSwipe();
            });
        });
    </script>
</head>

<body>
    <a-scene
        mindar-image="imageTargetSrc: ./carte.mind;"
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets>
            <!-- IMAGES DES ENTRÉES -->
            <img id="entree1" src="./entree1.jpg" />
            <img id="entree2" src="./entree2.jpg" />
            
            <!-- IMAGES DES PLATS -->
            <img id="plat1" src="./plat1.jpg" />
            <img id="plat2" src="./plat2.jpg" />
            <img id="plat3" src="./plat3.jpg" />
            
            <!-- IMAGES DES DESSERTS -->
            <img id="dessert1" src="./dessert1.jpg" />
            <img id="dessert2" src="./dessert2.jpg" />
        </a-assets>

        <a-entity mindar-image-target="targetIndex: 0" id="affiche">
            
            <!-- LES TEXTES (MENUS) -->
            <!-- L'attribut 'geometry' crée un fond transparent pour rendre la zone cliquable plus grande avec le doigt -->
            <a-text id="btn-entree" class="clickable" value="ENTREES" align="center" position="0 0.9 0" scale="0.6 0.6 0.6" color="white" 
                    geometry="primitive: plane; width: 1.5; height: 0.4" material="opacity: 0.0; transparent: true"></a-text>
            
            <a-text id="btn-plat" class="clickable" value="PLATS" align="center" position="0 0.7 0" scale="0.6 0.6 0.6" color="yellow" 
                    geometry="primitive: plane; width: 1.5; height: 0.4" material="opacity: 0.0; transparent: true"></a-text>
            
            <a-text id="btn-dessert" class="clickable" value="DESSERTS" align="center" position="0 0.5 0" scale="0.6 0.6 0.6" color="white" 
                    geometry="primitive: plane; width: 1.5; height: 0.4" material="opacity: 0.0; transparent: true"></a-text>

            <!-- L'IMAGE PRINCIPALE -->
            <!-- Positionnée plus bas (Y = -0.3) et plus petite (scale = 0.8) -->
            <a-plane id="gallery-image" src="#plat1" position="0 -0.3 0" width="1" height="1" scale="0.8 0.8 0.8" rotation="0 0 0"></a-plane>
            
        </a-entity>

        <!-- LA CAMÉRA (INDISPENSABLE POUR LES CLICS) -->
        <!-- On a remis le "raycaster" pour qu'A-Frame détecte quand ton doigt touche les éléments avec la classe "clickable" -->
        <a-camera cursor="fuse: false; rayOrigin: mouse;" raycaster="objects: .clickable" position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>
</body>
</html>
